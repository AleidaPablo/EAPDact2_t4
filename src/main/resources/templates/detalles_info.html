<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actividad 2 - MVC y Thymeleaf (EAPD)</title>
</head>
<body>
    <h1>Actividad 2 - MVC y Thymeleaf (EAPD)</h1>
    <p>Desarrollado por: <strong th:text="${usuarioConfig}"></strong></p>

    <h2>Empleados por Puesto (@RequestParam)</h2>
    <form action="/detalles_info" method="get">
        <input type="text" name="puesto" placeholder="Ej. Gerente, Secretaria...">
        <button type="submit">Buscar</button>
        <a href="/detalles_info">Limpiar</a>
    </form>
    <br>
    <a href="/formulario">+ Registrar Nuevo Empleado</a>

    <h2>Catálogo de Empleados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Puesto</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${empleados}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.nombre + ' ' + emp.apellido}"></td>
                <td th:text="${emp.puesto}"></td>
                <td th:text="${emp.direccion != null ? emp.direccion : 'No especificada'}"></td>
                <td>
                    <a th:href="@{/api/variable/pagina1/{msg}(msg=${emp.nombre})}">Ver Detalle (@PathVariable)</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
